<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring AI RAG - Document Upload & Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar for Document Upload -->
            <div class="col-md-4 col-lg-3 sidebar">
                <div class="sidebar-content">
                    <h2 class="text-center mb-4">
                        <i class="fas fa-robot text-primary"></i>
                        Spring AI RAG
                    </h2>
                    
                    <!-- Document Upload Section -->
                    <div class="card mb-4">
                        <div class="card-header">
                            <h5><i class="fas fa-upload me-2"></i>Upload Documents</h5>
                        </div>
                        <div class="card-body">
                            <form id="uploadForm" enctype="multipart/form-data">
                                <div class="mb-3">
                                    <label for="file" class="form-label">Select File</label>
                                    <input type="file" class="form-control" id="file" name="file" 
                                           accept=".pdf,.docx,.doc,.txt,.html,.csv,.rtf,.pptx,.ppt" required>
                                    <small class="form-text text-muted">
                                        Supported: PDF, DOCX, DOC, TXT, HTML, CSV, RTF, PPTX, PPT (Max 50MB)
                                    </small>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="description" class="form-label">Description (Optional)</label>
                                    <textarea class="form-control" id="description" name="description" rows="2" 
                                              placeholder="Brief description of the document"></textarea>
                                </div>
                                
                                <!-- Advanced Settings (Collapsible) -->
                                <div class="accordion mb-3" id="advancedSettings">
                                    <div class="accordion-item">
                                        <h6 class="accordion-header">
                                            <button class="accordion-button collapsed" type="button" 
                                                    data-bs-toggle="collapse" data-bs-target="#advancedOptions">
                                                <small>Advanced Settings</small>
                                            </button>
                                        </h6>
                                        <div id="advancedOptions" class="accordion-collapse collapse" 
                                             data-bs-parent="#advancedSettings">
                                            <div class="accordion-body">
                                                <div class="mb-2">
                                                    <label for="chunkSize" class="form-label">
                                                        <small>Chunk Size</small>
                                                    </label>
                                                    <input type="number" class="form-control form-control-sm" 
                                                           id="chunkSize" name="chunkSize" value="800" min="100" max="2000">
                                                </div>
                                                <div class="mb-2">
                                                    <label for="chunkOverlap" class="form-label">
                                                        <small>Chunk Overlap</small>
                                                    </label>
                                                    <input type="number" class="form-control form-control-sm" 
                                                           id="chunkOverlap" name="chunkOverlap" value="100" min="0" max="500">
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                                <button type="submit" class="btn btn-primary w-100" id="uploadBtn">
                                    <i class="fas fa-upload me-2"></i>Upload & Process
                                </button>
                            </form>
                            
                            <!-- Upload Progress -->
                            <div id="uploadProgress" class="mt-3" style="display: none;">
                                <div class="progress">
                                    <div class="progress-bar progress-bar-striped progress-bar-animated" 
                                         role="progressbar" style="width: 0%"></div>
                                </div>
                                <small class="text-muted mt-2 d-block" id="uploadStatus">Processing...</small>
                            </div>
                            
                            <!-- Upload Result -->
                            <div id="uploadResult" class="mt-3" style="display: none;"></div>
                        </div>
                    </div>
                    
                    <!-- Chat Settings -->
                    <div class="card">
                        <div class="card-header">
                            <h6><i class="fas fa-cog me-2"></i>Chat Settings</h6>
                        </div>
                        <div class="card-body">
                            <div class="mb-2">
                                <label for="topK" class="form-label">
                                    <small>Results Count</small>
                                </label>
                                <input type="number" class="form-control form-control-sm" 
                                       id="topK" value="5" min="1" max="20">
                            </div>
                            <div class="mb-2">
                                <label for="threshold" class="form-label">
                                    <small>Similarity Threshold</small>
                                </label>
                                <input type="number" class="form-control form-control-sm" 
                                       id="threshold" value="0.7" min="0.1" max="1.0" step="0.1">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Main Chat Area -->
            <div class="col-md-8 col-lg-9 main-content">
                <div class="chat-container">
                    <div class="chat-header">
                        <h4><i class="fas fa-comments me-2"></i>AI Assistant</h4>
                        <small class="text-muted">Ask questions about your uploaded documents</small>
                    </div>
                    
                    <!-- Chat Messages -->
                    <div class="chat-messages" id="chatMessages">
                        <div class="message assistant-message">
                            <div class="message-content">
                                <i class="fas fa-robot me-2"></i>
                                <span>Hello! I'm your AI assistant. Upload some documents and I'll help you find information from them.</span>
                            </div>
                            <small class="message-time">Just now</small>
                        </div>
                    </div>
                    
                    <!-- Chat Input -->
                    <div class="chat-input">
                        <form id="chatForm" class="d-flex">
                            <input type="text" class="form-control me-2" id="messageInput" 
                                   placeholder="Ask a question about your documents..." autocomplete="off">
                            <button type="submit" class="btn btn-primary" id="sendBtn">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</body>
</html>
